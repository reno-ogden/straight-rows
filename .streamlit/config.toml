# Dashboard settings (local only). Launch from the repository root.
[browser]
gatherUsageStats = false   # no usage telemetry; the demo needs no network

[server]
headless = true            # do not prompt or auto-open a browser
address = "localhost"

# FIELD SIGNAL blue investigation workspace (project palette, not official Bluestaq branding).
# Background #091321 · panels #122238 (set per panel in dashboard.py) · raised controls #1A304B
# Primary blue #4C8DFF · cyan #35D0DB · text #EDF4FF · secondary text #A9BCD3 · amber #F5B85A · coral #FF7B86
[theme]
base = "dark"
backgroundColor = "#091321"
secondaryBackgroundColor = "#1A304B"
textColor = "#EDF4FF"
primaryColor = "#4C8DFF"
linkColor = "#7FB0FF"
borderColor = "#2A4566"
showWidgetBorder = true
baseRadius = "medium"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
codeBackgroundColor = "#1A304B"
codeTextColor = "#EDF4FF"
dataframeHeaderBackgroundColor = "#1A304B"
dataframeBorderColor = "#2A4566"
blueColor = "#4C8DFF"
blueBackgroundColor = "#1A304B"
blueTextColor = "#9CC1FF"
grayBackgroundColor = "#1A304B"
grayTextColor = "#C3D2E4"
orangeColor = "#F5B85A"
orangeBackgroundColor = "#3A2F1C"
orangeTextColor = "#F5C77E"
redColor = "#FF7B86"
redBackgroundColor = "#3B1F2A"
redTextColor = "#FF9EA6"
# Tractor colours first (T1 blue, T2 amber, T3 cyan); used only for tractor identity.
chartCategoricalColors = ["#4C8DFF", "#F5B85A", "#35D0DB", "#A98BFF", "#FF7B86", "#E7EEF8", "#9FB3C8", "#7BD88F"]
