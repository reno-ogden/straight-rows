# Dashboard settings (local only). Launch from the repository root.
[browser]
gatherUsageStats = false   # no usage telemetry; the demo needs no network

[server]
headless = true            # do not prompt or auto-open a browser
address = "localhost"

# FIELD SIGNAL interactive incident report (project design, not official Bluestaq branding).
# Navy shell (#0B1A30, set in dashboard.py) · cool near-white canvas · white evidence surfaces ·
# strong blue for selection and primary actions · cyan limited accent · amber/coral for warnings.
[theme]
base = "light"
backgroundColor = "#F3F6FA"
secondaryBackgroundColor = "#E8EEF6"
textColor = "#14213D"
primaryColor = "#1F5FD1"
linkColor = "#1F5FD1"
borderColor = "#D3DCE8"
showWidgetBorder = true
baseRadius = "small"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
codeBackgroundColor = "#E8EEF6"
codeTextColor = "#14213D"
dataframeHeaderBackgroundColor = "#E8EEF6"
dataframeBorderColor = "#D3DCE8"
blueColor = "#1F5FD1"
blueBackgroundColor = "#E3ECFB"
blueTextColor = "#163F8F"
orangeColor = "#B7791F"
orangeBackgroundColor = "#FBF0DC"
orangeTextColor = "#7A4D0B"
redColor = "#C2364A"
redBackgroundColor = "#FBE5E8"
redTextColor = "#8E1F30"
# Tractor colours first (T1 blue, T2 orange, T3 green); used only for tractor identity.
chartCategoricalColors = ["#1971C2", "#D9480F", "#2B8A3E", "#6741D9", "#C2255C", "#5C677D", "#0C8599", "#E67700"]
