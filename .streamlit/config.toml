# Dashboard settings (local only). Launch from the repository root.
[browser]
gatherUsageStats = false   # no usage telemetry; the demo needs no network

[server]
headless = true            # do not prompt or auto-open a browser
address = "localhost"

# "Field Signal" theme: warm ivory paper, charcoal ink, restrained green accent, fine rules.
[theme]
base = "light"
backgroundColor = "#f5f1e6"
secondaryBackgroundColor = "#ebe5d6"
textColor = "#23221e"
primaryColor = "#2e6b4e"
linkColor = "#2e6b4e"
borderColor = "#cfc7b4"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "small"
font = "sans-serif"
headingFont = "serif"
codeFont = "monospace"
codeBackgroundColor = "#ebe5d6"
codeTextColor = "#23221e"
dataframeHeaderBackgroundColor = "#ebe5d6"
dataframeBorderColor = "#cfc7b4"
greenColor = "#2e6b4e"
greenBackgroundColor = "#dfe8dd"
greenTextColor = "#244f3a"
grayBackgroundColor = "#e4dfd2"
grayTextColor = "#4a4740"
orangeBackgroundColor = "#f1e2c8"
orangeTextColor = "#6b4a12"
# Tractor colours first (slots 1-3; T2/T3 darkened for >= 3:1 contrast on the ivory background).
chartCategoricalColors = ["#2a78d6", "#d0581f", "#128a5f", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]
